[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[project]
name = "signal-engine"
version = "0.1.6"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "seppaleinen", email = "davidbaeriksson@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "python-dotenv>=1.2.4",
    "pytest>=8.0.0",
]

[project.scripts]
signal-engine = "signal_engine.cli:main"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]