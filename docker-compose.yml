version: "3.9"

services:
  signal-engine:
    image: signal-engine:latest
    build: .
    volumes:
      - ./data:/app/data
      - ./digests:/app/digests
    environment:
      - LITELLM_BASE_URL=${LITELLM_BASE_URL:-https://litellm.labb.site/v1}
      - LITELLM_API_KEY=${LITELLM_API_KEY:-}
    command: --run

  # Optional: run on a schedule using a cron container
  # signal-engine-cron:
  #   image: signal-engine:latest
  #   volumes:
  #     - ./data:/app/data
  #     - ./digests:/app/digests
  #   environment:
  #     - LITELLM_BASE_URL=${LITELLM_BASE_URL:-https://litellm.labb.site/v1}
  #     - LITELLM_API_KEY=${LITELLM_API_KEY:-}
  #   command: sh -c "while true; do signal-engine --run; sleep 86400; done"