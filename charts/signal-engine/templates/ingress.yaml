{{- if .Values.ingress.enabled -}}
{{- $fullName := include "signal-engine.fullname" . | printf "%s-viewer" -}}
{{- $servicePort := .Values.service.port -}}
{{- $ingressClassName := .Values.ingress.className -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "signal-engine.fullname" . | printf "%s-viewer" | quote }}
  labels:
    {{- include "signal-engine.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if $ingressClassName }}
  ingressClassName: {{ $ingressClassName | quote }}
  {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- toYaml .Values.ingress.tls | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path | quote }}
            pathType: {{ .pathType | quote }}
            backend:
              service:
                name: {{ $fullName | quote }}
                port:
                  number: {{ $servicePort }}
          {{- end }}
    {{- end }}
{{- end -}}