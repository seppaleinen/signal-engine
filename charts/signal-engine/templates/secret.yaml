{{- if .Values.secret -}}
{{- $secretName := include "signal-engine.fullname" . | printf "%s-secret" -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName | quote }}
  labels:
    {{- include "signal-engine.labels" . | nindent 4 }}
type: Opaque
stringData:
  # PLACEHOLDER values. Do NOT commit real credentials.
  # Set at install time:
  #   helm install signal-engine ./charts/signal-engine \
  #     --set secret.litellmBaseUrl=https://your-llm/v1 \
  #     --set secret.litellmApiKey=YOUR-KEY
  # Or pre-create the secret with kubectl:
  #   kubectl create secret generic {{ $secretName }} \
  #     --from-literal=LITELLM_BASE_URL=https://your-llm/v1 \
  #     --from-literal=LITELLM_API_KEY=YOUR-KEY
  LITELLM_BASE_URL: {{ .Values.secret.litellmBaseUrl | quote }}
  LITELLM_API_KEY: {{ .Values.secret.litellmApiKey | quote }}
{{- end -}}