apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.configMap.name | default "signal-engine-config" | quote }}
  labels:
    {{- include "signal-engine.labels" . | nindent 4 }}
data:
  # Non-secret runtime configuration. Secrets live in secret.yaml.
  DIGESTS_DIR: "/app/digests"
  DATA_DIR: "/app/data"
  VIEWER_PORT: {{ .Values.viewer.port | quote }}
  CRON_SCHEDULE: {{ .Values.cronJob.schedule | quote }}
  # sources.yaml is the source configuration file.
  # Use .Values.configMap.sourcesYaml for override.
  {{- if .Values.configMap.sourcesYaml }}
  sources.yaml: |-
{{ .Values.configMap.sourcesYaml | indent 4 }}
  {{- else if .Files.Get "config/sources.yaml" }}
  sources.yaml: |-
{{ .Files.Get "config/sources.yaml" | indent 4 }}
  {{- end }}