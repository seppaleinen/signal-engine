{{- if .Values.viewer.replicas -}}
{{- $secretName := include "signal-engine.fullname" . | printf "%s-secret" -}}
{{- $cmName := .Values.configMap.name | default "signal-engine-config" -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "signal-engine.fullname" . | printf "%s-viewer" | quote }}
  labels:
    {{- include "signal-engine.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.viewer.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "signal-engine.name" . | quote }}
      app.kubernetes.io/instance: {{ .Release.Name | quote }}
      app.kubernetes.io/component: viewer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "signal-engine.name" . | quote }}
        app.kubernetes.io/instance: {{ .Release.Name | quote }}
        app.kubernetes.io/component: viewer
    spec:
      {{- if .Values.persistence.enabled }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "signal-engine.fullname" . | printf "%s-data" | quote }}
        - name: digests
          persistentVolumeClaim:
            claimName: {{ include "signal-engine.fullname" . | printf "%s-digests" | quote }}
      {{- end }}
      containers:
        - name: viewer
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - signal-engine
            - --viewer
            - --port
            - {{ .Values.viewer.port | quote }}
            - --digests-dir
            - /app/digests
          ports:
            - name: http
              containerPort: {{ .Values.viewer.port }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ $cmName | quote }}
            - secretRef:
                name: {{ $secretName | quote }}
          {{- if .Values.viewer.extraEnv }}
          env:
            {{- range .Values.viewer.extraEnv }}
            - name: {{ .name | quote }}
              value: {{ .value | quote }}
            {{- end }}
          {{- end }}
          volumeMounts:
            {{- if .Values.persistence.enabled }}
            - name: data
              mountPath: /app/data
            - name: digests
              mountPath: /app/digests
              readOnly: false
            {{- end }}
          resources:
            {{- toYaml .Values.viewer.resources | nindent 12 }}
{{- end -}}